<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NIDS Console</title>
<style>
  :root {
    --bg: #0b0f0d;
    --panel: #101613;
    --line: #1e2b25;
    --text: #d7e5dd;
    --dim: #6f8a7c;
    --safe: #4fd897;
    --danger: #ff6b5e;
    --mono: 'Courier New', Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    margin: 0;
    padding: 40px 24px;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 1px solid var(--line);
    padding-bottom: 16px;
    margin-bottom: 28px;
  }
  h1 {
    font-size: 20px;
    letter-spacing: 2px;
    margin: 0;
    text-transform: uppercase;
  }
  h1 span { color: var(--safe); }
  .sub { color: var(--dim); font-size: 12px; letter-spacing: 1px; }

  button {
    background: transparent;
    color: var(--safe);
    border: 1px solid var(--safe);
    padding: 10px 18px;
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 1px;
    cursor: pointer;
    text-transform: uppercase;
  }
  button:hover { background: var(--safe); color: #06110c; }
  button:disabled { opacity: 0.4; cursor: default; }

  .panel {
    border: 1px solid var(--line);
    background: var(--panel);
    padding: 20px;
    margin-bottom: 20px;
  }
  .panel-title {
    color: var(--dim);
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 14px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 8px;
  }
  .feature-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px 24px;
    font-size: 13px;
  }
  .feature-grid div span:first-child { color: var(--dim); }
  .feature-grid div span:last-child { float: right; }

  .truth-banner {
    text-align: center;
    padding: 14px;
    font-size: 15px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 20px;
    border: 1px solid var(--line);
  }
  .truth-banner.normal { color: var(--safe); border-color: var(--safe); }
  .truth-banner.attack { color: var(--danger); border-color: var(--danger); }

  .model-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
  }
  .model-row:last-child { border-bottom: none; }
  .model-name { color: var(--text); text-transform: uppercase; letter-spacing: 1px; }
  .verdict { font-weight: bold; letter-spacing: 1px; }
  .verdict.normal { color: var(--safe); }
  .verdict.attack { color: var(--danger); }
  .confidence { color: var(--dim); margin-left: 10px; font-size: 12px; }
  .correct-tag { font-size: 11px; margin-left: 10px; }
  .correct-tag.yes { color: var(--safe); }
  .correct-tag.no { color: var(--danger); }

  .ai-panel {
    border: 1px solid var(--line);
    background: #131916;
    padding: 18px;
    margin-bottom: 20px;
    font-size: 13px;
    line-height: 1.6;
  }
  .ai-title {
    color: var(--dim);
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .placeholder { color: var(--dim); text-align: center; padding: 30px 0; }
  footer { color: var(--dim); font-size: 11px; text-align: center; margin-top: 30px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>NIDS<span>_</span>Console</h1>
      <div class="sub">network intrusion detection // local demo</div>
    </div>
    <button id="pull-btn" onclick="pullSample()">Pull traffic sample</button>
  </header>

  <div class="panel">
    <div class="panel-title">Traffic record (from held-out test set)</div>
    <div id="feature-box" class="placeholder">No record loaded yet. Click "Pull traffic sample" above.</div>
  </div>

  <div id="truth-box"></div>

  <div class="panel ai-panel" id="ai-panel" style="display:none;">
    <div class="ai-title">AI assistant</div>
    <div id="ai-explanation"></div>
  </div>

  <div class="panel" id="predictions-panel" style="display:none;">
    <div class="panel-title">Model verdicts</div>
    <div id="predictions"></div>
  </div>

  <footer>Decision Tree · Random Forest · Naive Bayes — trained on NSL-KDD</footer>
</div>

<script>
async function pullSample() {
  const btn = document.getElementById('pull-btn');
  btn.disabled = true;
  btn.textContent = 'Reading...';

  try {
    const res = await fetch('/api/random_sample');
    const data = await res.json();
    renderFeatures(data.features);
    renderTruth(data.true_label);
    renderPredictions(data.predictions, data.true_label);
  } catch (e) {
    document.getElementById('feature-box').textContent = 'Error loading sample — is app.py running with trained models in models/?';
  }

  btn.disabled = false;
  btn.textContent = 'Pull traffic sample';
}

function renderFeatures(features) {
  const box = document.getElementById('feature-box');
  box.className = '';
  box.innerHTML = '<div class="feature-grid">' +
    Object.entries(features).map(([k, v]) =>
      `<div><span>${k}</span><span>${v}</span></div>`
    ).join('') +
    '</div>';
}

function renderTruth(trueLabel) {
  const box = document.getElementById('truth-box');
  box.innerHTML = `<div class="truth-banner ${trueLabel}">
    Ground truth: ${trueLabel === 'attack' ? 'Malicious traffic' : 'Normal traffic'}
  </div>`;
}

function renderPredictions(predictions, trueLabel) {
  document.getElementById('predictions-panel').style.display = 'block';
  const el = document.getElementById('predictions');
  el.innerHTML = Object.entries(predictions).map(([name, p]) => {
    const correct = p.prediction === trueLabel;
    return `<div class="model-row">
      <span class="model-name">${name.replace('_', ' ')}</span>
      <span>
        <span class="verdict ${p.prediction}">${p.prediction}</span>
        <span class="confidence">${(p.confidence * 100).toFixed(1)}% confidence</span>
        <span class="correct-tag ${correct ? 'yes' : 'no'}">${correct ? '✓ correct' : '✗ missed'}</span>
      </span>
    </div>`;
  }).join('');
}

function renderAI(explanation) {
  document.getElementById('ai-panel').style.display = 'block';
  document.getElementById('ai-explanation').textContent = explanation;
}

async function pullSample() {
  const btn = document.getElementById('pull-btn');
  btn.disabled = true;
  btn.textContent = 'Reading...';

  try {
    const res = await fetch('/api/random_sample');
    const data = await res.json();
    renderFeatures(data.features);
    renderTruth(data.true_label);
    renderPredictions(data.predictions, data.true_label);
    renderAI(data.ai_explanation);
  } catch (e) {
    document.getElementById('feature-box').textContent = 'Error loading sample — is app.py running with trained models in models/?';
  }

  btn.disabled = false;
  btn.textContent = 'Pull traffic sample';
}
</script>
</body>
</html>
